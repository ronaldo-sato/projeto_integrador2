{% extends "base/layout.html" %}

{% block titulo %}Editar medicamento{% endblock %}

{% block conteudo %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <nav aria-label="Navegação estrutural" class="mb-3">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'medicamento:listar' %}">Medicamentos</a></li>
          <li class="breadcrumb-item active" aria-current="page">Editar</li>
        </ol>
      </nav>

      <div class="card">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-1">Editar medicamento</h1>
          <p class="text-body-secondary mb-4">{{ medicamento.nome }} · {{ medicamento.fabricante }}</p>

          <form action="{% url 'medicamento:atualizar' medicamento.id %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="nome-medicamento" class="form-label">Medicamento</label>
              <input type="text" id="nome-medicamento" name="nome_medicamento" class="form-control" required
                     maxlength="{{ max_nome }}" value="{{ dados.nome }}">
            </div>
            <div class="mb-4">
              <label for="fabricante" class="form-label">Fabricante (marca)</label>
              <input type="text" id="fabricante" name="fabricante" class="form-control" required
                     maxlength="{{ max_fabricante }}" value="{{ dados.fabricante }}">
            </div>
            <div class="d-flex gap-2 justify-content-end">
              <a href="{% url 'medicamento:listar' %}" class="btn btn-light">Cancelar</a>
              <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
