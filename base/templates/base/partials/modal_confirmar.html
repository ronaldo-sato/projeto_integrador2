<!-- Confirmação antes de excluir: usada por qualquer formulário com o
     atributo data-confirmar (ver app.js). A mensagem é inserida como texto,
     nunca como HTML/JavaScript -->
<div class="modal fade" id="modal-confirmar" tabindex="-1" aria-labelledby="modal-confirmar-titulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-body text-center p-4">
        <div class="icone-alerta mb-3" aria-hidden="true"><i class="bi bi-trash3"></i></div>
        <h2 class="fs-5 mb-2" id="modal-confirmar-titulo">Confirmar exclusão</h2>
        <p class="text-body-secondary mb-0" id="modal-confirmar-mensagem"></p>
      </div>
      <div class="modal-footer border-0 pt-0 justify-content-center">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="modal-confirmar-ok">Excluir</button>
      </div>
    </div>
  </div>
</div>
