<!--Cadastro Medicamento-->
<section id="medicamento" class="main-content section-page">
    <div>
    <h2>Cadastro de Medicamento</h2>
    <form id="formulario-medicamento" class="formulario" action="{% url 'medicamento:cadastrar' %}" method="POST">
        {% csrf_token %}
        <fieldset class="fieldset">
        <legend>Preencha</legend>
        <p>
            <label for="nome-medicamento">Medicamento:</label>
            <input type="text" id="nome-medicamento" name="nome_medicamento" placeholder="Nome do medicamento" required>
        </p>
        <p>
            <label for="fabricante">Fabricante:</label>
            <input type="text" id="fabricante" name="fabricante" placeholder="Marca" required>
        </p>
        <p>
            <button type="reset" class="button">Limpar</button>
            <button type="submit" class="button">Cadastrar</button>
        </p>
        </fieldset>
    </form>
    </div>
</section>
