{% load static %}

<!--Home-->
<section id="home" class="main-content section-page">
  <div>
    <h1>Comparador de Preços</h1>
    <p>
        Esta é uma aplicação protótipo para comparação de preços de medicamentos.
    </p>
    <br>
    <div class="cta-buttons">
      <p>Para utilizar: </p>
      <button id="btn-home-login" class="button">Entre</button>
      ou
      <button id="btn-home-register" class="button">Cadastre-se</button>
    </div>
    <br>
    <script src="{% static 'global/js/auth-modal.js' %}"></script>
  </div>

  <!-- JANELA POP-UP (MODAL) DE AUTENTICAÇÃO -->
  <div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <!-- Botão X para fechar (sem onclick inline) -->
      <span id="close-modal-btn" class="close-modal">&times;</span>

      <!-- Abas para alternar entre Login e Cadastro (sem onclick inline) -->
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab">Entrar</button>
        <button id="tab-register" class="auth-tab">Cadastrar</button>
      </div>

      <!-- Formulário de Login -->
      <form id="form-login" action="{% url 'base:login' %}" method="POST">
        {% csrf_token %}
        <p>
          <label for="login-username">Usuário:</label>
          <input type="text" id="login-username" name="username" required placeholder="Digite seu usuário">
        </p>
        <p>
          <label for="login-password">Senha:</label>
          <input type="password" id="login-password" name="password" required placeholder="Digite sua senha">
        </p>
        <button type="submit" class="button">Acessar Conta</button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="form-register" action="{% url 'base:register' %}" method="POST" style="display: none;">
        {% csrf_token %}
        <p>
          <label for="reg-username">Nome de Usuário:</label>
          <input type="text" id="reg-username" name="username" required placeholder="Ex: joaosilva">
        </p>
        <p>
          <label for="reg-email">E-mail:</label>
          <input type="email" id="reg-email" name="email" required placeholder="seu@email.com">
        </p>
        <p>
          <label for="reg-password">Senha:</label>
          <input type="password" id="reg-password" name="password" required placeholder="Mínimo 8 caracteres">
        </p>
        <button type="submit" class="button">Criar Conta</button>
      </form>
    </div>
  </div>
</section>
